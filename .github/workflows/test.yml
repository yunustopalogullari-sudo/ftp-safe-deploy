name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyftpdlib
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning ftp-safe-deploy tests/run.sh
      - name: end-to-end tests
        run: bash tests/run.sh
